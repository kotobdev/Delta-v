- type: species
  id: Glimmerbeast
  name: species-name-glimmerbeast
  roundStart: false # no fun allowed
  prototype: MobGlimmerbeast
  sprites: MobGlimmerbeastSprites
  defaultSkinTone: "#ffffff"
  markingLimits: MobGlimmerbeastMarkingLimits
  dollPrototype: MobGlimmerbeastDummy
  skinColoration: Hues # TODO: set a custom one that's just a range from black to white
  sexes:
  - Unsexed

- type: speciesBaseSprites # TODO: get eyes as their own layer
  id: MobGlimmerbeastSprites
  sprites:
    Head: MobGlimmerbeastHead
    #Hair: MobHumanoidAnyMarking
    #Snout: MobHumanoidAnyMarking
    Chest: MobGlimmerbeastTorso
    HeadTop: MobGlimmerbeastAnyMarking
    #HeadSide: MobHumanoidAnyMarking
    Snout: MobGlimmerbeastEyes # holy shit this is hacky
    #Tail: MobHumanoidAnyMarking
    #Eyes: MobGlimmerbeastEyes # eyes will force eye color which we do NOT WANT
    LArm: MobGlimmerbeastLArm
    RArm: MobGlimmerbeastRArm
    LHand: MobGlimmerbeastLHand
    RHand: MobGlimmerbeastRHand
    LLeg: MobGlimmerbeastLLeg
    RLeg: MobGlimmerbeastRLeg
    LFoot: MobGlimmerbeastLFoot
    RFoot: MobGlimmerbeastRFoot

- type: markingPoints # mostly copied from MobAsakimMarkingLimits, doesn't really do much as of now (random markings Soon)
  id: MobGlimmerbeastMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    Tail:
      points: 1
      required: false
    HeadTop:
      points: 2
      required: true
      defaultMarkings: [ GlimmerbeastStringy ]
    HeadSide:
      points: 2 # WWDP-Edit
      required: false
    Chest:
      points: 3
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false

