  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    damage: # I'll be honest, I really don't want this dealing shadow.
      types:
        Shadow: 11
        Slash: 15
  - type: Damageable
  - type: Vocal # placeholder
    sounds:
      Male: MaleVulpkanin
      Female: FemaleVulpkanin
      Unsexed: MaleVulpkanin
  - type: Insulated
  - type: MobThresholds # In their actual context, this should probably be 75-100. Balance pass needed
    thresholds:
      0: Alive
      74.99: Critical
      75: Dead # This is also a hack to make deathgasps not appear, FYI.
  - type: PassiveDamage # Gamer passive regen.
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Heat: -5.0
      groups:
        Brute: -5.0
