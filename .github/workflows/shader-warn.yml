name: Shader Warning

on:
  pull_request_target:
    paths:
      - '**/*.swsl'

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
    - name: Potentially find comment
      uses: peter-evans/find-comment@v4
      id: fc
      with:
        issue-number: ${{ github.event.number }}
        comment-author: 'github-actions[bot]'
        body-includes: This PR adds or modifies a shader.

    - name: Create comment if it doesn't exist
      if: steps.fc.outputs.comment-id == ''
      uses: peter-evans/create-or-update-comment@v5
      with:
        issue-number: ${{ github.event.number }}
        body: |
          This PR adds or modifies a shader. Please make sure to test your changes in compatibility and non-compatibility mode!
